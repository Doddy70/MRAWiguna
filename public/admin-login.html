<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Bengkel Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <header class="hero-header">
      <div class="brand">Bengkel Assistant</div>
      <nav class="hero-nav">
        <a href="/">Beranda</a>
        <a href="/booking.html">Reservasi</a>
      </nav>
      <button class="ghost-btn" onclick="location.href='/'">Kembali</button>
    </header>

    <main class="section" style="max-width: 520px;">
      <section class="panel">
        <h2>Login Admin</h2>
        <p class="chat-hint">Masuk untuk mengakses dashboard reservasi.</p>
        <form id="admin-login-form" class="booking-form">
          <label>
            Username
            <input name="username" type="text" placeholder="admin" required />
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="********" required />
          </label>
          <button type="submit" class="primary">Masuk</button>
        </form>
        <div id="login-result" class="result"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("admin-login-form");
      const result = document.getElementById("login-result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "";
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Login gagal");
          window.location.href = "/admin.html";
        } catch (error) {
          result.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
