<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Customer - Bengkel Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand">Bengkel Assistant</div>
          <p>Portal Customer</p>
        </div>
        <h1>Masuk</h1>
        <p class="auth-sub">Akses dashboard pelanggan dan status booking.</p>
        <form id="customer-login-form" class="booking-form">
          <label>
            Username
            <input name="username" type="text" placeholder="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="••••••••" required />
          </label>
          <button type="submit" class="primary">Masuk</button>
        </form>
        <div id="customer-login-result" class="result"></div>
        <div class="auth-footer">
          Belum punya akun?
          <a href="/customer-signup.html">Daftar sekarang</a>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
